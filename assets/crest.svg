<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 252" width="240" height="252">
  <!-- Fan-drawn rendition of the Streamer University 2026 crest:
       gold crown, crossed flag-lances, laurel, quartered shield
       (blackletter S / scroll / tower / blackletter U), 20-26 ribbon. -->
  <defs>
    <clipPath id="sh">
      <path d="M120 75 L185 90 L185 150 C185 190 158 214 120 231 C82 214 55 190 55 150 L55 90 Z"/>
    </clipPath>
    <path id="arc" d="M26 208 Q120 252 214 208" fill="none"/>
    <g id="leaf"><ellipse rx="9" ry="3.6" fill="#c6a050"/></g>
  </defs>

  <!-- crossed lances -->
  <g stroke="#c6a050" stroke-width="7" stroke-linecap="round">
    <line x1="42" y1="216" x2="192" y2="56"/>
    <line x1="198" y1="216" x2="48" y2="56"/>
  </g>
  <g fill="#c6a050">
    <g transform="translate(196,51) rotate(43)"><path d="M0 12 L7 -6 L0 -18 L-7 -6 Z"/></g>
    <g transform="translate(44,51) rotate(-43)"><path d="M0 12 L7 -6 L0 -18 L-7 -6 Z"/></g>
  </g>
  <!-- pennant flags -->
  <path d="M178 71 C198 76 216 86 230 100 C222 108 220 118 226 132 C210 122 194 118 182 118 C186 104 184 88 178 71 Z" fill="#8a1b33"/>
  <path d="M62 71 C42 76 24 86 10 100 C18 108 20 118 14 132 C30 122 46 118 58 118 C54 104 56 88 62 71 Z" fill="#8a1b33"/>

  <!-- laurel branches -->
  <g>
    <path d="M40 118 C28 150 30 182 52 212" fill="none" stroke="#c6a050" stroke-width="3.4" stroke-linecap="round"/>
    <use href="#leaf" transform="translate(38,124) rotate(-70)"/>
    <use href="#leaf" transform="translate(33,142) rotate(-82)"/>
    <use href="#leaf" transform="translate(31,160) rotate(-92)"/>
    <use href="#leaf" transform="translate(33,178) rotate(-104)"/>
    <use href="#leaf" transform="translate(39,195) rotate(-120)"/>
    <use href="#leaf" transform="translate(48,208) rotate(-136)"/>
  </g>
  <g>
    <path d="M200 118 C212 150 210 182 188 212" fill="none" stroke="#c6a050" stroke-width="3.4" stroke-linecap="round"/>
    <use href="#leaf" transform="translate(202,124) rotate(70)"/>
    <use href="#leaf" transform="translate(207,142) rotate(82)"/>
    <use href="#leaf" transform="translate(209,160) rotate(92)"/>
    <use href="#leaf" transform="translate(207,178) rotate(104)"/>
    <use href="#leaf" transform="translate(201,195) rotate(120)"/>
    <use href="#leaf" transform="translate(192,208) rotate(136)"/>
  </g>

  <!-- crown -->
  <g fill="#c6a050">
    <polygon points="82,58 87,30 96,46 104,22 112,44 120,16 128,44 136,22 144,46 153,30 158,58"/>
    <circle cx="87" cy="27" r="4"/><circle cx="104" cy="19" r="4"/><circle cx="120" cy="13" r="4.5"/>
    <circle cx="136" cy="19" r="4"/><circle cx="153" cy="27" r="4"/>
    <rect x="78" y="56" width="84" height="13" rx="5"/>
  </g>
  <g fill="#9c7c33">
    <circle cx="88" cy="62.5" r="2.6"/><circle cx="99" cy="62.5" r="2.6"/><circle cx="110" cy="62.5" r="2.6"/>
    <circle cx="120" cy="62.5" r="2.6"/><circle cx="130" cy="62.5" r="2.6"/><circle cx="141" cy="62.5" r="2.6"/>
    <circle cx="152" cy="62.5" r="2.6"/>
  </g>

  <!-- 20 / 26 ribbon ends -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="17" fill="#c6a050" text-anchor="middle">
    <polygon points="8,168 58,162 58,196 8,202 20,182" fill="#7a1428"/>
    <polygon points="232,168 182,162 182,196 232,202 220,182" fill="#7a1428"/>
    <text x="36" y="187">20</text>
    <text x="204" y="187">26</text>
  </g>

  <!-- shield -->
  <g clip-path="url(#sh)">
    <rect x="50" y="70" width="70" height="81" fill="#c6a050"/>
    <rect x="120" y="70" width="70" height="81" fill="#8a1b33"/>
    <rect x="50" y="151" width="70" height="85" fill="#8a1b33"/>
    <rect x="120" y="151" width="70" height="85" fill="#c6a050"/>
    <g stroke="#e8c87a" stroke-width="3">
      <line x1="120" y1="70" x2="120" y2="236"/>
      <line x1="50" y1="151" x2="190" y2="151"/>
    </g>
  </g>
  <path d="M120 75 L185 90 L185 150 C185 190 158 214 120 231 C82 214 55 190 55 150 L55 90 Z"
        fill="none" stroke="#c6a050" stroke-width="7" stroke-linejoin="round"/>
  <path d="M120 75 L185 90 L185 150 C185 190 158 214 120 231 C82 214 55 190 55 150 L55 90 Z"
        fill="none" stroke="#5e0f1f" stroke-width="1.5" stroke-linejoin="round" opacity="0.6"/>

  <!-- TL: blackletter S -->
  <text x="88" y="138" text-anchor="middle" font-family="'UnifrakturMaguntia','Old English Text MT',Georgia,serif"
        font-weight="bold" font-size="50" fill="#8a1b33">S</text>
  <!-- BR: blackletter U -->
  <text x="153" y="215" text-anchor="middle" font-family="'UnifrakturMaguntia','Old English Text MT',Georgia,serif"
        font-weight="bold" font-size="50" fill="#8a1b33">U</text>

  <!-- TR: scroll -->
  <g transform="translate(152,113) rotate(-38)" stroke="#c6a050" fill="none" stroke-width="4">
    <rect x="-9" y="-24" width="18" height="48" rx="8" fill="none"/>
    <line x1="-8" y1="-12" x2="8" y2="-12"/>
    <line x1="-8" y1="0" x2="8" y2="0"/>
    <line x1="-8" y1="12" x2="8" y2="12"/>
    <circle cx="0" cy="-24" r="6" fill="#c6a050" stroke="none"/>
    <circle cx="0" cy="24" r="6" fill="#c6a050" stroke="none"/>
  </g>

  <!-- BL: tower -->
  <g transform="translate(87,192)" fill="#c6a050">
    <polygon points="-15,-10 15,-10 0,-34"/>
    <path d="M-12 -10 h24 v32 a4 4 0 0 1 -4 4 h-16 a4 4 0 0 1 -4 -4 Z"/>
    <g stroke="#8a1b33" stroke-width="2">
      <line x1="-12" y1="-1" x2="12" y2="-1"/>
      <line x1="-12" y1="8" x2="12" y2="8"/>
      <line x1="-12" y1="17" x2="12" y2="17"/>
      <line x1="0" y1="-10" x2="0" y2="-1"/>
      <line x1="-6" y1="-1" x2="-6" y2="8"/><line x1="6" y1="-1" x2="6" y2="8"/>
      <line x1="0" y1="8" x2="0" y2="17"/>
      <line x1="-6" y1="17" x2="-6" y2="26"/><line x1="6" y1="17" x2="6" y2="26"/>
    </g>
  </g>

  <!-- bottom ribbon -->
  <use href="#arc" stroke="#8a1b33" stroke-width="24" stroke-linecap="round"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="13"
        letter-spacing="1" fill="#e8c87a">
    <textPath href="#arc" startOffset="50%" text-anchor="middle"><tspan dy="4.5">STREAMER UNIVERSITY</tspan></textPath>
  </text>
</svg>
